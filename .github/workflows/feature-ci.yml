name: Feature CI

on:
  push:
    branches:
      - feature/mvp-vertical-slice
      - fix/auth-login-panel-connection-state
      - feature/item-creator-design
      - feature/account-auth-restoration
      - fix/admin-creator-production-deploy
      - fix/render-legacy-migration-compatibility
      - fix/render-server-start-script
      - fix/render-postgres-icon-fallback
      - fix/pin-aws-sdk-version
      - fix/render-same-origin-deploy
      - main

concurrency:
  group: feature-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: web_mmorpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d web_mmorpg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/web_mmorpg_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - name: Install dependencies and run the Render postinstall build
        run: RENDER=true npm install
      - name: Verify npm install generated Render-root assets
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const html = readFileSync("apps/client/dist/index.html", "utf8");
          if (!html.includes('src="/assets/') || !html.includes('href="/assets/')) {
            throw new Error("Render npm install must produce root-based client assets.");
          }
          NODE
      - name: Verify empty-database migrations
        run: npm run db:migrate --workspace @web-mmorpg/server
      - run: npm test
      - run: npm run build
      - name: Verify GitHub Pages client asset paths
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const html = readFileSync("apps/client/dist/index.html", "utf8");
          if (
            !html.includes('src="/WEB_MMORPG/assets/') ||
            !html.includes('href="/WEB_MMORPG/assets/')
          ) {
            throw new Error("GitHub Pages client assets must use /WEB_MMORPG/.");
          }
          NODE
      - name: Build the client for Render
        run: VITE_BASE_PATH=/ VITE_GAME_SERVER_URL='' npm run build -w @web-mmorpg/client
      - name: Verify Render client asset paths
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const html = readFileSync("apps/client/dist/index.html", "utf8");
          if (
            !html.includes('src="/assets/') ||
            !html.includes('href="/assets/')
          ) {
            throw new Error("Render client assets must use the web root.");
          }
          NODE
