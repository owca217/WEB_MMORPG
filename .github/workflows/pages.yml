name: Deploy client to GitHub Pages

# Temporary deployment bridge: the github-pages environment currently allows
# this historical branch. The workflow itself always builds the current `main`.
on:
  push:
    branches:
      - feature/mvp-vertical-slice
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current final build
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use verified npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm install

      - name: Build client
        env:
          VITE_GAME_SERVER_URL: https://web-mmorpg-server.onrender.com
          VITE_ENABLE_ADMIN_LOGIN: "true"
          VITE_PERSISTENT_ACCOUNTS: ${{ vars.VITE_PERSISTENT_ACCOUNTS || 'false' }}
        run: npm run build -w @web-mmorpg/client

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: apps/client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
